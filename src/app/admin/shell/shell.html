<div class="adm">
  @if (api.demo) {
    <div class="adm-demo">
      <strong>Демо-режим.</strong> База даних не підключена: зміни зберігаються лише в цьому браузері й не потрапляють на сайт для інших.
    </div>
  }
  <header class="adm-top">
    <div class="adm-top__inner">
      <a routerLink="/admin" class="adm-logo"><img src="assets/logo.svg" alt="GeniusDev" width="120" height="38" /><span>Адмінка</span></a>
      <nav class="adm-nav">
        <a routerLink="/admin/leads" routerLinkActive="is-active"><app-icon name="inbox" [size]="18" /> Заявки</a>
        <a routerLink="/admin/services" routerLinkActive="is-active"><app-icon name="list" [size]="18" /> Послуги</a>
      </nav>
      <div class="adm-user">
        <a href="/" target="_blank" rel="noopener" class="adm-link"><app-icon name="external" [size]="16" /> <span>Сайт</span></a>
        @if (email()) { <span class="adm-email">{{ email() }}</span> }
        <button type="button" class="adm-btn adm-btn--ghost adm-btn--sm" (click)="logout()"><app-icon name="logout" [size]="16" /> Вийти</button>
      </div>
    </div>
  </header>
  <main class="adm-main"><router-outlet /></main>

  <div class="adm-toasts" aria-live="polite">
    @for (t of toast.toasts(); track t.id) {
      <div class="adm-toast" [class.is-error]="t.kind === 'error'">
        <span>{{ t.text }}</span>
        <button type="button" (click)="toast.dismiss(t.id)" aria-label="Закрити"><app-icon name="close" [size]="16" /></button>
      </div>
    }
  </div>
</div>
